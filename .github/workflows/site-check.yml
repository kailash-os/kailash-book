name: site-check
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  site-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Recipe gate self-test (RED fixtures -> OK, offline)
        run: python3 tests/test_recipe_gate.py
      - name: Recipe gate (anatomy + provenance + no-invented-evidence + directory counts)
        run: python3 tools/recipe_gate.py --report tools/recipe-gate-report.json
      - name: Upload gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recipe-gate-report
          path: tools/recipe-gate-report.json
          retention-days: 7
      - uses: quarto-dev/quarto-actions/setup@v2
      - name: Render (fail on broken refs)
        run: quarto render
      - name: HTML present
        run: test -s index.html || test -s _site/index.html
